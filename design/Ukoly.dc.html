<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>ScioCamp – Úkoly</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#F4F6FB}
a{color:#1F4FB8}a:hover{color:#163C8F}
</style>
</helmet>
<div style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #111A33; background: #F4F6FB; min-height: 100vh; display: flex; flex-wrap: wrap">
  <div style="flex: 1 1 248px; background: #FFFFFF; border-right: 1px solid #E3E8F2">
    <dc-import name="Sidebar" active="ukoly" hint-size="100%,880px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px 48px">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">

      <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
        <div style="flex: 1 1 260px; min-width: 0">
          <h1 style="margin: 0; font-size: 30px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em">Úkoly</h1>
          <div style="font-size: 14px; color: #5A6782; font-weight: 500; margin-top: 6px">{{subtitle}}</div>
        </div>
        <sc-if value="{{isTeacher}}" hint-placeholder-val="{{false}}">
          <button style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: #3B6FE0; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            Zadat úkol
          </button>
        </sc-if>
        <div aria-label="Šimon Samuel Liška" style="width: 44px; height: 44px; border-radius: 22px; background: #3B6FE0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px">ŠL</div>
      </header>

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
        <div role="tablist" aria-label="Filtr úkolů" style="display: flex; flex-wrap: wrap; gap: 6px; padding: 5px; background: #FFFFFF; border: 1px solid #E3E8F2; border-radius: 14px">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
            <button role="tab" aria-selected="{{f.selected}}" onClick="{{f.pick}}" style="{{f.style}}"><span style="{{f.dotStyle}}"></span>{{f.label}}<span style="{{f.countStyle}}">{{f.count}}</span></button>
          </sc-for>
        </div>
        <label style="margin-left: auto; flex: 0 1 280px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; background: #FFFFFF; border: 1px solid #E3E8F2; border-radius: 12px; color: #5A6782; box-sizing: border-box">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input type="search" aria-label="Hledat úkol" placeholder="Hledat úkol…" style="border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: #111A33; flex: 1; min-width: 0">
        </label>
      </div>

      <section aria-label="Seznam úkolů" style="background: #FFFFFF; border: 1px solid #E3E8F2; border-radius: 18px; overflow: hidden">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 16px 20px; border-bottom: 1px solid #EEF1F7">
            <div style="{{r.iconStyle}}">
              <sc-if value="{{r.isDone}}" hint-placeholder-val="{{false}}">
                <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"></path></svg>
              </sc-if>
              <sc-if value="{{r.isLate}}" hint-placeholder-val="{{false}}">
                <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 7v6M12 17h.01"></path></svg>
              </sc-if>
              <sc-if value="{{r.isWaiting}}" hint-placeholder-val="{{true}}">
                <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l2.5 1.5"></path></svg>
              </sc-if>
            </div>
            <div style="flex: 1 1 260px; min-width: 0">
              <div style="font-size: 15px; font-weight: 700">{{r.title}}</div>
              <div style="font-size: 13px; color: #5A6782; margin-top: 3px">{{r.course}}</div>
            </div>
            <div style="flex: 0 0 150px; font-size: 13px; color: #3A4560; font-weight: 600">{{r.due}}</div>
            <span style="{{r.chipStyle}}">{{r.statusLabel}}</span>
            <div style="flex: 0 0 150px; display: flex; justify-content: flex-end">
              <button onClick="{{r.act}}" style="{{r.btnStyle}}">{{r.btnLabel}}</button>
            </div>
          </div>
        </sc-for>
        <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
          <div style="padding: 48px 20px; text-align: center; color: #5A6782; font-size: 15px; font-weight: 600">V této kategorii nic není.</div>
        </sc-if>
      </section>

    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["student","učitel"],"default":"student"},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'vse', submitted: {} };
  }
  renderVals() {
    const base = [
      { id: 1, title: 'Reflexe prezentace z TEDx', course: 'Ateliér Prezentační schopnosti', due: 'zítra 23:59', status: 'ceka' },
      { id: 2, title: 'Příprava týmové prezentace', course: 'Ateliér Prezentační schopnosti', due: 'čt 22. 10.', status: 'ceka' },
      { id: 3, title: 'Esej: fraktály v přírodě', course: 'Komplexní čísla a fraktály', due: 'po 26. 10.', status: 'ceka' },
      { id: 4, title: 'Recenze filmové adaptace', course: 'Literatura ve filmu', due: 'pá 16. 10.', status: 'pozde' },
      { id: 5, title: 'Rozbor scény z filmu', course: 'Jak číst film', due: 'čt 15. 10.', status: 'pozde' },
      { id: 6, title: 'Kazuistika: první sezení', course: 'Psychoterapeutické minimum', due: 'st 14. 10.', status: 'pozde' },
      { id: 7, title: 'Seznam povinné literatury', course: 'Literatura ve filmu', due: 'odevzdáno 17. 10.', status: 'hotovo' },
      { id: 8, title: 'Plán trasy na expedici', course: 'Cestománie', due: 'odevzdáno 12. 10.', status: 'hotovo' },
      { id: 9, title: 'Protokol: toxicita látek', course: 'Chemie léků a jedů', due: 'odevzdáno 9. 10.', status: 'hotovo' },
      { id: 10, title: 'Partie s komentářem', course: 'Ateliér Šachy', due: 'odevzdáno 8. 10.', status: 'hotovo' }
    ];
    const sub = this.state.submitted;
    const all = base.map((t) => (sub[t.id] ? Object.assign({}, t, { status: 'hotovo', due: 'odevzdáno právě teď' }) : t));
    const chip = 'flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;';
    const icon = 'flex:none;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;';
    const btn = 'min-height:40px;padding:0 16px;border-radius:10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;';
    const look = {
      ceka: { label: 'Čeká', chip: chip + 'background:#FDF1DC;color:#8A5300;', icon: icon + 'background:#FDF1DC;color:#8A5300;', btnLabel: 'Odevzdat', btn: btn + 'border:0;background:#3B6FE0;color:#FFFFFF;' },
      pozde: { label: 'Po termínu', chip: chip + 'background:#FBE7E7;color:#A82E2E;', icon: icon + 'background:#FBE7E7;color:#A82E2E;', btnLabel: 'Odevzdat pozdě', btn: btn + 'border:1px solid #E7B4B4;background:#FFFFFF;color:#A82E2E;' },
      hotovo: { label: 'Hotovo', chip: chip + 'background:#E3F4EC;color:#17704A;', icon: icon + 'background:#E3F4EC;color:#17704A;', btnLabel: 'Zobrazit', btn: btn + 'border:1px solid #E3E8F2;background:#FFFFFF;color:#3A4560;' }
    };
    const counts = { vse: all.length, ceka: 0, pozde: 0, hotovo: 0 };
    all.forEach((t) => { counts[t.status] += 1; });
    const f = this.state.filter;
    const rows = all.filter((t) => f === 'vse' || t.status === f).map((t) => {
      const l = look[t.status];
      return Object.assign({}, t, {
        isDone: t.status === 'hotovo', isLate: t.status === 'pozde', isWaiting: t.status === 'ceka',
        statusLabel: l.label, chipStyle: l.chip, iconStyle: l.icon, btnLabel: l.btnLabel, btnStyle: l.btn,
        act: t.status === 'hotovo' ? () => {} : () => { const n = Object.assign({}, this.state.submitted); n[t.id] = true; this.setState({ submitted: n }); }
      });
    });
    const defs = [
      { k: 'vse', label: 'Vše', dot: null },
      { k: 'ceka', label: 'Čeká', dot: '#F0A63A' },
      { k: 'pozde', label: 'Po termínu', dot: '#C93B3B' },
      { k: 'hotovo', label: 'Hotovo', dot: '#1F8A5B' }
    ];
    const filters = defs.map((d) => {
      const sel = f === d.k;
      return {
        label: d.label, count: counts[d.k], selected: sel ? 'true' : 'false',
        pick: () => this.setState({ filter: d.k }),
        style: 'display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:10px;border:0;font:inherit;font-size:14px;font-weight:700;cursor:pointer;' + (sel ? 'background:#3B6FE0;color:#FFFFFF;' : 'background:transparent;color:#3A4560;'),
        dotStyle: d.dot ? 'width:8px;height:8px;border-radius:4px;background:' + d.dot + ';' + (sel ? 'box-shadow:0 0 0 2px #FFFFFF;' : '') : 'display:none',
        countStyle: 'font-size:12px;padding:1px 7px;border-radius:999px;' + (sel ? 'background:#2F5FCC;color:#FFFFFF;' : 'background:#EEF1F7;color:#3A4560;')
      };
    });
    const open = counts.ceka + counts.pozde;
    const isTeacher = (this.props.role ?? 'student') === 'učitel';
    return {
      filters: filters, rows: rows, isEmpty: rows.length === 0, isTeacher: isTeacher,
      subtitle: isTeacher ? 'Pohled učitele: zadávání a kontrola úkolů' : open + ' otevřených · ' + counts.pozde + ' po termínu'
    };
  }
}
</script>
</body>
</html>
