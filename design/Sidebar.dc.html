<!doctype html>
<html lang="cs">
<head>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Hlavní navigace" style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #111A33; background: #FFFFFF; box-sizing: border-box; width: 100%; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px">
  <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 0 8px; text-decoration: none; color: #111A33">

    </div>
    <div style="font-weight: 800; font-size: 19px; letter-spacing: -0.02em">ScioCamp</div>
  </a>

  <div style="display: flex; flex-direction: column; gap: 2px">
    <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6782; padding: 0 12px 8px">Přehled</div>
    <a href="Main.dc.html" style="{{st.domov}}">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
      Domov
    </a>
    <a href="Zapisy.dc.html" style="{{st.zapisy}}">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="M9 12h6M9 16h4"></path></svg>
      Zápisy
    </a>
    <a href="Ukoly.dc.html" style="{{st.ukoly}}">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="m8 12 3 3 5-6"></path></svg>
      Úkoly
      <span style="margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 11px; background: #3B6FE0; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">6</span>
    </a>
    <a href="Hlasovani.dc.html" style="{{st.hlasovani}}">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"></path><rect x="6" y="4" width="12" height="12" rx="2"></rect><path d="m9 10 2 2 4-4"></path></svg>
      Hlasování
      <span style="margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 11px; background: #3B6FE0; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span>
    </a>
    <a href="Zpravy.dc.html" style="{{st.zpravy}}">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"></path></svg>
      Zprávy
      <span style="margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 11px; background: #3B6FE0; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">3</span>
    </a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px">
    <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6782; padding: 0 12px 8px">Škola</div>
    <a href="Kurzy.dc.html" style="{{st.kurzy}}">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2z"></path><path d="M22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"></path></svg>
      Kurzy
    </a>
    <a href="Ateliery.dc.html" style="{{st.ateliery}}">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="7.5" r="4"></circle><rect x="13" y="13" width="8" height="8" rx="1.5"></rect><path d="M17 3l4 7h-8z"></path><path d="M3 17h7v4H3z"></path></svg>
      Ateliéry
    </a>
    <a href="Navrhy.dc.html" style="{{st.navrhy}}">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2z"></path></svg>
      Návrhy
    </a>
  </div>

  <sc-if value="{{showTeach}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6782; padding: 0 12px 8px">Výuka</div>
      <a href="Ucitel.dc.html" style="{{st.vyuka}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
        Moje třídy
        <span style="margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 11px; background: #F0A63A; color: #111A33; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">6</span>
      </a>
    </div>
  </sc-if>

  <sc-if value="{{showAdmin}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6782; padding: 0 12px 8px">Správa</div>
      <a href="Admin.dc.html" style="{{st.sprava}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><path d="m9 12 2 2 4-4"></path></svg>
        Uživatelé a škola
      </a>
    </div>
  </sc-if>

  <div style="margin-top: 8px; padding: 10px; border-radius: 14px; background: #F4F6FB; display: flex; align-items: center; gap: 8px">
    <a href="Profil.dc.html" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #111A33">
      <div style="flex: none; width: 38px; height: 38px; border-radius: 19px; background: #3B6FE0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">{{user.initials}}</div>
      <div style="min-width: 0; flex: 1">
        <div style="font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{user.name}}</div>
        <div style="font-size: 12px; color: #5A6782">{{user.role}}</div>
      </div>
    </a>
    <a href="Nastaveni.dc.html" aria-label="Nastavení" style="{{gearStyle}}">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>
    </a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["domov","zapisy","ukoly","hlasovani","zpravy","kurzy","ateliery","navrhy","vyuka","sprava","profil","nastaveni"],"default":"domov"},"role":{"editor":"enum","options":["student","ucitel","admin"],"default":"student"},"$preview":{"width":260,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const base = 'display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:600;';
    const on = base + 'background:#E8EFFD;color:#1F4FB8;';
    const off = base + 'background:transparent;color:#3A4560;';
    const active = this.props.active ?? 'domov';
    const role = this.props.role ?? 'student';
    const keys = ['domov', 'zapisy', 'ukoly', 'hlasovani', 'zpravy', 'kurzy', 'ateliery', 'navrhy', 'vyuka', 'sprava'];
    const st = {};
    keys.forEach((k) => { st[k] = k === active ? on : off; });
    const users = {
      student: { initials: 'ŠL', name: 'Šimon Samuel Liška', role: 'Student' },
      ucitel: { initials: 'AJ', name: 'Anežka Jakubcová', role: 'Učitelka' },
      admin: { initials: 'MP', name: 'Miroslav Pavel', role: 'Admin · učitel' }
    };
    const gear = 'flex:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;';
    return {
      st: st,
      showTeach: role === 'ucitel' || role === 'admin',
      showAdmin: role === 'admin',
      user: users[role] || users.student,
      gearStyle: gear + (active === 'nastaveni' ? 'background:#E8EFFD;color:#1F4FB8;' : 'color:#3A4560;')
    };
  }
}
</script>
</body>
</html>
